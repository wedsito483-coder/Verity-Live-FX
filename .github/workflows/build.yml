name: Compilar Filtros
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el ZIP
        run: |
          mkdir -p trabajo
          for z in *.zip; do
            if unzip -l "$z" | grep -q 'Filtros_base.apk'; then
              unzip -o -q "$z" -d trabajo
            fi
          done
          ls -la trabajo
          test -f trabajo/Filtros_base.apk
      - name: Alinear y firmar el APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p salida
          "$BT/zipalign" -f -p 4 trabajo/Filtros_base.apk trabajo/alineado.apk
          "$BT/apksigner" sign --ks trabajo/filtros.jks --ks-pass pass:filtros123 --key-pass pass:filtros123 --out salida/Filtros.apk trabajo/alineado.apk
          "$BT/apksigner" verify --verbose salida/Filtros.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Filtros-APK
          path: salida/Filtros.apk
