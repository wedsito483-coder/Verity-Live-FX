name: Crear ZIP con la APK
on:
  push:
    tags-ignore: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Usar el zip más reciente
        run: |
          best=""
          bt=0
          for z in *.zip; do
            t=$(git log -1 --format=%ct -- "$z")
            if [ "$t" -gt "$bt" ]; then
              bt=$t
              best="$z"
            fi
          done
          echo "Usando: $best"
          echo "ZIP_USADO=$best" >> "$GITHUB_ENV"
          unzip -q "$best"
          ls VerityLiveFX
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: VerityLiveFX
      - name: Meter la APK en un ZIP
        run: |
          mkdir salida
          cp VerityLiveFX/app/build/outputs/apk/debug/app-debug.apk salida/VerityLiveFX.apk
          cd salida
          zip ../VerityLiveFX-APK.zip VerityLiveFX.apk
      - name: Publicar el ZIP para descargarlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" VerityLiveFX-APK.zip \
            --title "APK #${{ github.run_number }} (${ZIP_USADO})" \
            --notes "ZIP con la APK, generado desde ${ZIP_USADO}"
