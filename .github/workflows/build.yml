
name: Crear ZIP con la APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VerityLiveFX-Android-Project.zip'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar proyecto
        run: |
          ZIP="VerityLiveFX-Android-Project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "No se encontró el proyecto Android: $ZIP"
            exit 1
          fi

          unzip -q "$ZIP" -d .
          test -f VerityLiveFX/settings.gradle
          test -f VerityLiveFX/app/build.gradle
          test -f VerityLiveFX/app/src/main/assets/index.html

          echo "Proyecto Android encontrado correctamente."

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: VerityLiveFX
        run: gradle assembleDebug

      - name: Comprobar APK
        run: |
          APK="VerityLiveFX/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p salida
          cp "$APK" salida/VerityLiveFX.apk
          cd salida
          zip ../VerityLiveFX-APK.zip VerityLiveFX.apk

      - name: Publicar APK en ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            VerityLiveFX-APK.zip \
            --title "VerityLiveFX APK #${{ github.run_number }}" \
            --notes "APK compilada automáticamente."
